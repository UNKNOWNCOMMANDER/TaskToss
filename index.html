<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>TaskToss</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path d="M2 12l19-9-6 9 6 9-19-9z" fill="currentColor"/>
      </svg>
    </div>
    <h1>TaskToss</h1>
    <span id="streak-badge" class="streak-badge" hidden></span>
    <span id="focus-status-badge" class="focus-status-badge" hidden></span>
    <span class="tag">write it. toss it.</span>
  </header>

  <nav class="booklet" id="board-tabs" aria-label="Boards">
    <!-- board tab stubs injected here -->
  </nav>

  <main>
    <form id="add-form" class="add-row" autocomplete="off">
      <input id="title-input" type="text" placeholder="Add a task…" maxlength="140" required />
      <select id="priority-input" aria-label="Priority">
        <option value="none">no rush</option>
        <option value="low">low</option>
        <option value="med">medium</option>
        <option value="high">high</option>
      </select>
      <input id="due-input" type="date" aria-label="Due date" />
      <input id="due-time-input" type="time" aria-label="Due time" />
      <button type="submit" class="add-btn" aria-label="Add task">+</button>
    </form>

    <div class="toolbar">
      <input id="search-input" type="search" placeholder="Search tasks and notes…" aria-label="Search" />
      <div class="view-switch" role="tablist" aria-label="View">
        <button id="view-list-btn" class="view-btn active" role="tab" aria-selected="true">list</button>
        <button id="view-board-btn" class="view-btn" role="tab" aria-selected="false">board</button>
        <button id="view-calendar-btn" class="view-btn" role="tab" aria-selected="false">calendar</button>
        <button id="view-archive-btn" class="view-btn" role="tab" aria-selected="false">archive</button>
        <button id="view-focus-btn" class="view-btn" role="tab" aria-selected="false">focus</button>
        <button id="view-profile-btn" class="view-btn" role="tab" aria-selected="false">profile</button>
      </div>
    </div>

    <div id="tag-filter" class="tag-filter" hidden></div>

    <section id="list" class="tickets" aria-live="polite">
      <!-- ticket cards / kanban injected here -->
    </section>

    <p id="empty-state" class="empty" hidden>
      No tasks yet. Add one above — you can toss it into any chat once it exists.
    </p>
    <p id="no-results" class="empty" hidden>Nothing matches here.</p>
  </main>

  <footer class="foot">
    <span id="sync-note">saved on this device</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
